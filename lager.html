<!doctype html><html lang=de><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Lager-Dashboard · 7 O'CLOCK</title><style>
:root{--bg:#faf8f5;--card:#fff;--ink:#2b2b2b;--mut:#8a8378;--line:#e7e2d9;--green:#2f8f57;--red:#c0492b;--amber:#c98a2b;--gold:#b79b6e;--dark:#4a4335;--blue:#2f6f8f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:20px}
.brand{font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:700}
h1{font-size:23px;margin:2px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.flab{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.bar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--ink)}
.bar button.on{background:#2b2b2b;color:#fff;border-color:#2b2b2b}
.bar input[type=date]{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;font-family:inherit;color:var(--ink)}
#stand{font-size:12px;color:var(--mut);margin:6px 0 12px}
.sec-h{font-size:13px;font-weight:800;color:#4a4335;margin:14px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;border-left:4px solid var(--line)}
.tile.good{border-left-color:var(--green)}.tile.bad{border-left-color:var(--red)}.tile.info{border-left-color:var(--blue)}.tile.gold{border-left-color:var(--gold)}.tile.warn{border-left-color:var(--amber)}
.th{display:flex;align-items:flex-start;gap:6px;font-size:11.5px}
.th .ic{font-size:14px;line-height:1.3}.th .nm{font-weight:600;color:#4a4335;flex:1;line-height:1.3}
.badge{font-size:11px;font-weight:800;padding:1px 6px;border-radius:20px;white-space:nowrap}
.val{font-size:28px;font-weight:800;color:#1c1c1c;margin:5px 0 2px}
.desc{font-size:11px;color:var(--mut);line-height:1.35}
.foot{color:var(--mut);font-size:11px;margin-top:14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
h2{font-size:15px;margin:0 0 4px;border-bottom:1px solid var(--line);padding-bottom:8px}
.ltbl{width:100%;border-collapse:collapse;font-size:13px}.ltbl td,.ltbl th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.ltbl th{color:var(--mut);font-weight:600;font-size:11px}.ltbl td.n{text-align:right}
.ltbl a{color:var(--blue);font-weight:700;text-decoration:none}.ltbl a:hover{text-decoration:underline}
.chip{font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px}
.chip.neu{color:#8a5a1a;background:#f6ecdd}.chip.best{color:#1e5a6b;background:#e6f0f3}
.chip.off{color:#a13a22;background:#f6e7e2}.chip.teil{color:#8a6d2f;background:#f7f1e3}
.chip.t-frisch{color:#1e6b3f;background:#e6f2ea}.chip.t-pruefen{color:#8a6410;background:#fbf0d6}.chip.t-ueberfaellig{color:#a13a22;background:#f6e7e2}
.chip.ges{color:#7a5a2a;background:#efe6d6}
.qty-hi{font-weight:800;color:#a13a22}
.lfilt{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.lfilt button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;font-weight:600;color:var(--ink)}
.lfilt button.on{background:#4a4335;color:#fff;border-color:#4a4335}
</style></head><body><div class=wrap>
<div class=brand>7 O'CLOCK · LAGER</div><h1>Lager-Dashboard</h1>
<div class=sub>Pick &amp; Pack auf einen Blick. Live aus Shopify (mit Wawi synchronisiert). Zeitraum wählbar, Vergleich zur Vorperiode.</div>
<div class=bar>
 <span class=flab>Zeitraum</span>
 <button data-today=1>Heute</button><button data-a=1>Gestern</button><button data-a=7 class=on>7 Tage</button><button data-a=30>30 Tage</button><button data-a=90>90 Tage</button><span id=months></span><button id=custBtn>Benutzerdefiniert</button>
</div>
<div class=bar id=custBar style="display:none">
 <span class=flab>Von</span><input type=date id=cFrom>
 <span class=flab>Bis</span><input type=date id=cTo>
 <button id=custGo class=on>Anzeigen</button>
</div>
<div id=stand>lädt …</div>
<div class=sec-h>📋 Pick &amp; Pack</div>
<div class=grid id=grid></div>
<div id=liste></div>
<div class=foot id=legend></div>
</div>
<script>
const W="https://rohertrag-worker.can-11b.workers.dev/lagershop.json";
let CUR=null;
const $=id=>document.getElementById(id);
const nf=n=>Math.round(n||0).toLocaleString("de-DE");
const de1=x=>(x||0).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmtd=s=>{let p=s.split("-");return p[2]+"."+p[1]+"."+p[0];};
const dpct=(a,b)=>b?((a-b)/b*100):(a?100:0);
function win(w){const e=new Date();e.setDate(e.getDate()-1);const s=new Date(e);s.setDate(s.getDate()-(w-1));return[iso(s),iso(e)];}
function badge(a,b,better){
 if(b==null||!isFinite(b)||b===0)return "";
 let dp=dpct(a,b);if(Math.abs(dp)<0.05)dp=0;
 const dir=dp>0?"▲":(dp<0?"▼":"■");
 let col,bg; if(better==="flat"||dp===0){col="#7a746a";bg="#efece5";} else {const good=(better==="down")?dp<0:dp>0;col=good?"#1e6b3f":"#a13a22";bg=good?"#e6f2ea":"#f6e7e2";}
 return '<span class=badge style="color:'+col+';background:'+bg+'">'+dir+" "+(dp>=0?"+":"")+de1(dp)+" %</span>";
}
function tile(cls,ic,nm,val,desc,a,b,better){
 return '<div class="tile '+cls+'"><div class=th><span class=ic>'+ic+'</span><span class=nm>'+nm+'</span>'+(b!=null?badge(a,b,better):"")+'</div><div class=val>'+val+'</div><div class=desc>'+(desc||"")+'</div></div>';
}
function render(){
 if(!CUR)return;const c=CUR.cur,p=CUR.prev,g=c.geschirr,gp=p.geschirr;
 let h="";
 h+=tile("info","📦","Bestellungen gesamt",nf(c.bestellungen),"Aufträge im Zeitraum",c.bestellungen,p.bestellungen,"up");
 h+=tile("good","✅","Pakete verpackt",nf(c.verpackt),"Versandlabel erstellt / fulfilled",c.verpackt,p.verpackt,"up");
 const og=CUR.offenGesamtSplit, ogs=CUR.offenGesamtStatus; const ogDesc=og?("davon "+nf(og.neusendung)+" Neusendungen · "+nf(og.bestellung)+" Bestellungen"+(ogs?" · "+nf(ogs.offen)+" offen / "+nf(ogs.teilweise)+" teilweise":"")+" · <b>Live</b>"):"bezahlt, noch nicht verschickt · <b>Live</b>";
 h+=tile((CUR.offenGesamt||0)>0?"info":"good","📥","Offene Bestellungen",nf(CUR.offenGesamt),ogDesc,null,null,null);
 const prs=CUR.pruefenSplit; const prDesc=(CUR.pruefen>0?("davon "+nf((prs||{}).neusendung||0)+" Neusendungen · "+nf((prs||{}).bestellung||0)+" Bestellungen · "):"")+"jüngere Aufträge schon versandt · <b>Live</b>";
 h+=tile((CUR.pruefen||0)>0?"warn":"good","🔎","Zu prüfen (übersprungen)",nf(CUR.pruefen),prDesc,null,null,null);
 const sp=CUR.ueberfaelligSplit, stt=CUR.ueberfaelligStatus; const ueDesc=sp?("davon "+nf(sp.neusendung)+" Neusendungen · "+nf(sp.bestellung)+" Bestellungen"+(stt?" · "+nf(stt.offen)+" offen / "+nf(stt.teilweise)+" teilweise":"")+" · <b>Live</b>"):"offen, bezahlt, nicht storniert · <b>Live</b>";
 h+=tile(CUR.ueberfaellig>0?"bad":"good","⏰","Überfällig (&gt; 3 Tage)",nf(CUR.ueberfaellig),ueDesc,null,null,null);
 h+=tile((CUR.aeltesteTage||0)>7?"bad":"info","📅","Älteste offene Bestellung",nf(CUR.aeltesteTage)+" T",(CUR.aeltesteDatum?"seit "+fmtd(CUR.aeltesteDatum)+" · ":"")+"offen &amp; unverschickt · <b>Live</b>",null,null,null);
 h+=tile("gold","🍽️","Geschirrset-Bestellungen",nf(g.gesamt),"eigenes Label, gesondert gepackt",g.gesamt,gp.gesamt,"up");
 h+=tile("gold","🎁","Geschirrsets verpackt",nf(g.gepackt),"offen: "+nf(g.offen)+" · teilweise: "+nf(g.partial)+" (von "+nf(g.gesamt)+")",g.gepackt,gp.gepackt,"up");
 $("grid").innerHTML=h;
 // Liste der offenen Aufträge (Rückstand) — klickbar zu Shopify, mit Typ-Filter
 renderListe();
 const gen=CUR.generatedAt?new Date(CUR.generatedAt):null;
 $("stand").innerHTML="<b>"+fmtd(CUR.since)+" – "+fmtd(CUR.until)+"</b> · Badge = Δ vs. Vorperiode "+fmtd(CUR.prevSince)+"–"+fmtd(CUR.prevUntil)+(gen?" · Stand "+pad(gen.getDate())+"."+pad(gen.getMonth()+1)+". "+pad(gen.getHours())+":"+pad(gen.getMinutes()):"");
}
let LSTUFE="alle", LTYP="alle";
function setStufe(f){LSTUFE=f;renderListe();}
function setTyp(f){LTYP=f;renderListe();}
const TIERLAB={frisch:"frisch",pruefen:"zu prüfen",ueberfaellig:"überfällig"};
function renderListe(){
 if(!CUR){$("liste").innerHTML="";return;}
 const all=CUR.offeneListe||[];
 if(!all.length){$("liste").innerHTML="";return;}
 const cStufe=t=>all.filter(o=>o.tier===t).length;
 const cTyp=(t,pool)=>pool.filter(o=>t==="neu"?o.typ==="Neusendung":o.typ!=="Neusendung").length;
 // Filter anwenden (Stufe UND Typ)
 let L=all;
 if(LSTUFE!=="alle")L=L.filter(o=>o.tier===LSTUFE);
 if(LTYP!=="alle")L=L.filter(o=>LTYP==="neu"?o.typ==="Neusendung":o.typ!=="Neusendung");
 const link=id=>"https://admin.shopify.com/store/7oclock-de/orders/"+id;
 const bs=(f,lab)=>'<button class="'+(LSTUFE===f?"on":"")+'" onclick="setStufe(\''+f+'\')">'+lab+'</button>';
 const bt=(f,lab)=>'<button class="'+(LTYP===f?"on":"")+'" onclick="setTyp(\''+f+'\')">'+lab+'</button>';
 let t='<div class=sec><h2>Offene Aufträge ('+all.length+')</h2><div style="font-size:12px;color:var(--mut);margin:0 0 10px">Alle bezahlten, noch nicht verschickten Aufträge — älteste zuerst. Klick öffnet den Auftrag in Shopify. „Live"-Stand, unabhängig vom Zeitraumfilter. <b>🔴 überfällig</b> = &gt;3 Tage · <b>🟡 zu prüfen</b> = übersprungen (ein jüngerer Auftrag ist schon raus) · <b>🟢 frisch</b> = normaler Tageslauf.</div>';
 t+='<div class=lfilt><span class=flab style="align-self:center">Stufe</span>'+bs("alle","Alle ("+all.length+")")+bs("ueberfaellig","🔴 Überfällig ("+cStufe("ueberfaellig")+")")+bs("pruefen","🟡 Zu prüfen ("+cStufe("pruefen")+")")+bs("frisch","🟢 Frisch ("+cStufe("frisch")+")")+'</div>';
 t+='<div class=lfilt><span class=flab style="align-self:center">Typ</span>'+bt("alle","Alle")+bt("neu","Neusendungen")+bt("best","Bestellungen")+'</div>';
 t+='<table class=ltbl><tr><th>Auftrag</th><th>Stufe</th><th>Typ</th><th>Status</th><th class=n>max. Menge</th><th>erstellt</th><th class=n>Alter</th></tr>';
 t+=L.map(o=>{
   const tier='<span class="chip t-'+o.tier+'">'+(TIERLAB[o.tier]||o.tier)+'</span>'+(o.geschirr?' <span class="chip ges">Geschirr</span>':'');
   const typ=o.typ==="Neusendung"?'<span class="chip neu">Neusendung</span>':'<span class="chip best">Bestellung</span>';
   const st=o.status==="teilweise"?'<span class="chip teil">teilweise</span>':'<span class="chip off">offen</span>';
   const q=(o.maxQty||0)>=6?'<span class=qty-hi>'+nf(o.maxQty)+'×</span>':(nf(o.maxQty)+'×');
   return '<tr><td><a href="'+link(o.id)+'" target=_blank rel=noopener>'+o.name+'</a></td><td>'+tier+'</td><td>'+typ+'</td><td>'+st+'</td><td class=n>'+q+'</td><td>'+fmtd(o.created)+'</td><td class=n style="font-weight:700;color:'+((o.ageTage||0)>3?"var(--red)":"var(--ink)")+'">'+nf(o.ageTage)+' T</td></tr>';
 }).join("");
 t+='</table>'+(L.length?'':'<div style="color:var(--mut);font-size:13px;padding:6px 0">Keine Aufträge in dieser Auswahl.</div>')+'</div>';
 $("liste").innerHTML=t;
}
function load(a,b,label){$("stand").textContent="lädt "+label+" …";fetch(W+"?since="+a+"&until="+b).then(r=>r.json()).then(d=>{CUR=d;render();}).catch(e=>{$("stand").textContent="Fehler: "+e;});}
function clearZ(){document.querySelectorAll(".bar button[data-a],.bar button[data-today],#months button,#custBtn").forEach(y=>y.classList.remove("on"));$("custBar").style.display="none";}
document.querySelectorAll(".bar button[data-a]").forEach(x=>x.onclick=()=>{clearZ();x.classList.add("on");const[a,b]=win(+x.dataset.a);load(a,b,x.textContent);});
document.querySelector(".bar button[data-today]").onclick=function(){clearZ();this.classList.add("on");const t=iso(new Date());load(t,t,"Heute");};
$("custBtn").onclick=function(){clearZ();this.classList.add("on");const cb=$("custBar");cb.style.display="flex";const e=new Date();e.setDate(e.getDate()-1);if(!$("cTo").value)$("cTo").value=iso(e);if(!$("cFrom").value){const s=new Date(e);s.setDate(s.getDate()-6);$("cFrom").value=iso(s);}};
$("custGo").onclick=function(){const a=$("cFrom").value,b=$("cTo").value;if(!a||!b)return;if(a>b){alert("Von-Datum liegt nach Bis-Datum");return;}load(a,b,"Benutzerdefiniert");};
(function(){const now=new Date(),y=now.getFullYear(),cm=now.getMonth();const names=["Jan","Feb","März","Apr","Mai","Juni","Juli","Aug","Sep","Okt","Nov","Dez"];let h="";for(let m=0;m<=cm;m++)h+='<button data-ym="'+y+'-'+pad(m+1)+'"'+(m===cm?' data-cur=1':'')+'>'+names[m]+'</button>';$("months").innerHTML=h;const e=new Date();e.setDate(e.getDate()-1);const yest=iso(e);$("months").querySelectorAll("button").forEach(x=>x.onclick=()=>{clearZ();x.classList.add("on");const ym=x.dataset.ym,[Y,M]=ym.split("-").map(Number),a=ym+"-01",b=x.dataset.cur?yest:iso(new Date(Y,M,0));load(a,b,x.textContent);});})();
$("legend").innerHTML="Quelle: Shopify (mit JTL-Wawi synchronisiert). <b>Pakete verpackt</b> = Aufträge mit erstelltem Versandlabel (fulfilled); da ein Geschirrset ein Extra-Label bekommt, ist die echte Paketzahl minimal höher. <b>Offene Bestellungen</b> = die gesamte Pick-Queue: alle bezahlten, noch nicht verschickten Aufträge (0–90 Tage, Live-Stand, unabhängig vom Zeitraumfilter). <b>Zu prüfen (übersprungen)</b> = ein noch offener Nicht-Geschirr-Auftrag, obwohl bereits jüngere Aufträge versandt wurden (Frühwarnung, bevor er überfällig wird — Geschirr läuft legitim nach und wird separat markiert). <b>Überfällig</b> = offene Aufträge, die älter als 3 Tage sind. Die Spalte <b>max. Menge</b> zeigt die höchste Stückzahl einer Position im Auftrag — hohe Mengen (rot ab 6×) sind ein typischer Grund, warum ein Auftrag hängt (Menge größer als im Kommissionierbereich). <b>Geschirrsets verpackt/offen</b> = auf Auftragsebene. Bestand/Meldebestand folgt als eigener Block.";
(()=>{const[a,b]=win(7);load(a,b,"7 Tage");})();
</script></body></html>
