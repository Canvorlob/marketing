<!doctype html><html lang=de><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Lager-Dashboard · 7 O'CLOCK</title><style>
:root{--bg:#faf8f5;--card:#fff;--ink:#2b2b2b;--mut:#8a8378;--line:#e7e2d9;--green:#2f8f57;--red:#c0492b;--amber:#c98a2b;--gold:#b79b6e;--dark:#4a4335;--blue:#2f6f8f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:20px}
.brand{font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:700}
h1{font-size:23px;margin:2px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.flab{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.bar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--ink)}
.bar button.on{background:#2b2b2b;color:#fff;border-color:#2b2b2b}
#stand{font-size:12px;color:var(--mut);margin:6px 0 12px}
.sec-h{font-size:13px;font-weight:800;color:#4a4335;margin:14px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;border-left:4px solid var(--line)}
.tile.good{border-left-color:var(--green)}.tile.bad{border-left-color:var(--red)}.tile.info{border-left-color:var(--blue)}.tile.gold{border-left-color:var(--gold)}
.th{display:flex;align-items:flex-start;gap:6px;font-size:11.5px}
.th .ic{font-size:14px;line-height:1.3}.th .nm{font-weight:600;color:#4a4335;flex:1;line-height:1.3}
.badge{font-size:11px;font-weight:800;padding:1px 6px;border-radius:20px;white-space:nowrap}
.val{font-size:28px;font-weight:800;color:#1c1c1c;margin:5px 0 2px}
.desc{font-size:11px;color:var(--mut);line-height:1.35}
.foot{color:var(--mut);font-size:11px;margin-top:14px}
</style></head><body><div class=wrap>
<div class=brand>7 O'CLOCK · LAGER</div><h1>Lager-Dashboard</h1>
<div class=sub>Pick &amp; Pack auf einen Blick. Live aus Shopify (mit Wawi synchronisiert). Zeitraum wählbar, Vergleich zur Vorperiode.</div>
<div class=bar>
 <span class=flab>Zeitraum</span>
 <button data-a=1>Gestern</button><button data-a=7 class=on>7 Tage</button><button data-a=30>30 Tage</button><button data-a=90>90 Tage</button><span id=months></span>
</div>
<div id=stand>lädt …</div>
<div class=sec-h>📋 Pick &amp; Pack</div>
<div class=grid id=grid></div>
<div class=foot id=legend></div>
</div>
<script>
const W="https://rohertrag-worker.can-11b.workers.dev/lagershop.json";
let CUR=null;
const $=id=>document.getElementById(id);
const nf=n=>Math.round(n||0).toLocaleString("de-DE");
const de1=x=>(x||0).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmtd=s=>{let p=s.split("-");return p[2]+"."+p[1]+"."+p[0];};
const dpct=(a,b)=>b?((a-b)/b*100):(a?100:0);
function win(w){const e=new Date();e.setDate(e.getDate()-1);const s=new Date(e);s.setDate(s.getDate()-(w-1));return[iso(s),iso(e)];}
function badge(a,b,better){
 if(b==null||!isFinite(b)||b===0)return "";
 let dp=dpct(a,b);if(Math.abs(dp)<0.05)dp=0;
 const dir=dp>0?"▲":(dp<0?"▼":"■");
 let col,bg; if(better==="flat"||dp===0){col="#7a746a";bg="#efece5";} else {const good=(better==="down")?dp<0:dp>0;col=good?"#1e6b3f":"#a13a22";bg=good?"#e6f2ea":"#f6e7e2";}
 return '<span class=badge style="color:'+col+';background:'+bg+'">'+dir+" "+(dp>=0?"+":"")+de1(dp)+" %</span>";
}
function tile(cls,ic,nm,val,desc,a,b,better){
 return '<div class="tile '+cls+'"><div class=th><span class=ic>'+ic+'</span><span class=nm>'+nm+'</span>'+(b!=null?badge(a,b,better):"")+'</div><div class=val>'+val+'</div><div class=desc>'+(desc||"")+'</div></div>';
}
function render(){
 if(!CUR)return;const c=CUR.cur,p=CUR.prev,g=c.geschirr,gp=p.geschirr;
 let h="";
 h+=tile("info","📦","Bestellungen gesamt",nf(c.bestellungen),"Aufträge im Zeitraum",c.bestellungen,p.bestellungen,"up");
 h+=tile("good","✅","Pakete verpackt",nf(c.verpackt),"Versandlabel erstellt / fulfilled",c.verpackt,p.verpackt,"up");
 h+=tile(CUR.ueberfaellig>0?"bad":"good","⏰","Überfällig (&gt; 3 Tage)",nf(CUR.ueberfaellig),"offen &amp; 3–90 T alt · <b>aktueller Stand</b>",null,null,null);
 h+=tile("gold","🍽️","Geschirrset-Bestellungen",nf(g.gesamt),"eigenes Label, gesondert gepackt",g.gesamt,gp.gesamt,"up");
 h+=tile("gold","🎁","Geschirrsets verpackt",nf(g.gepackt),"offen: "+nf(g.offen)+" · teilweise: "+nf(g.partial)+" (von "+nf(g.gesamt)+")",g.gepackt,gp.gepackt,"up");
 $("grid").innerHTML=h;
 const gen=CUR.generatedAt?new Date(CUR.generatedAt):null;
 $("stand").innerHTML="<b>"+fmtd(CUR.since)+" – "+fmtd(CUR.until)+"</b> · Badge = Δ vs. Vorperiode "+fmtd(CUR.prevSince)+"–"+fmtd(CUR.prevUntil)+(gen?" · Stand "+pad(gen.getDate())+"."+pad(gen.getMonth()+1)+". "+pad(gen.getHours())+":"+pad(gen.getMinutes()):"");
}
function load(a,b,label){$("stand").textContent="lädt "+label+" …";fetch(W+"?since="+a+"&until="+b).then(r=>r.json()).then(d=>{CUR=d;render();}).catch(e=>{$("stand").textContent="Fehler: "+e;});}
function clearZ(){document.querySelectorAll(".bar button[data-a],#months button").forEach(y=>y.classList.remove("on"));}
document.querySelectorAll(".bar button[data-a]").forEach(x=>x.onclick=()=>{clearZ();x.classList.add("on");const[a,b]=win(+x.dataset.a);load(a,b,x.textContent);});
(function(){const now=new Date(),y=now.getFullYear(),cm=now.getMonth();const names=["Jan","Feb","März","Apr","Mai","Juni","Juli","Aug","Sep","Okt","Nov","Dez"];let h="";for(let m=0;m<=cm;m++)h+='<button data-ym="'+y+'-'+pad(m+1)+'"'+(m===cm?' data-cur=1':'')+'>'+names[m]+'</button>';$("months").innerHTML=h;const e=new Date();e.setDate(e.getDate()-1);const yest=iso(e);$("months").querySelectorAll("button").forEach(x=>x.onclick=()=>{clearZ();x.classList.add("on");const ym=x.dataset.ym,[Y,M]=ym.split("-").map(Number),a=ym+"-01",b=x.dataset.cur?yest:iso(new Date(Y,M,0));load(a,b,x.textContent);});})();
$("legend").innerHTML="Quelle: Shopify (mit JTL-Wawi synchronisiert). <b>Pakete verpackt</b> = Aufträge mit erstelltem Versandlabel (fulfilled); da ein Geschirrset ein Extra-Label bekommt, ist die echte Paketzahl minimal höher. <b>Überfällig</b> = aktuell offene, unverschickte Aufträge, die 3–90 Tage alt sind (Live-Stand, unabhängig vom Zeitraumfilter). <b>Geschirrsets verpackt/offen</b> = auf Auftragsebene. Bestand/Meldebestand folgt als eigener Block.";
(()=>{const[a,b]=win(7);load(a,b,"7 Tage");})();
</script></body></html>
