<!doctype html><html lang=de><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Erstattungen · 7 O'CLOCK</title><style>
:root{--bg:#faf8f5;--card:#fff;--ink:#2b2b2b;--mut:#8a8378;--line:#e7e2d9;--green:#2f8f57;--red:#c0492b;--amber:#c98a2b;--gold:#b79b6e;--dark:#4a4335;--blue:#2f6f8f;--purple:#6a5aa0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:20px}
.brand{font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:700}
h1{font-size:23px;margin:2px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.flab{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.bar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--ink)}
.bar button.on{background:#2b2b2b;color:#fff;border-color:#2b2b2b}
.bar input[type=date]{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;font-family:inherit;color:var(--ink)}
#stand{font-size:12px;color:var(--mut);margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;border-left:4px solid var(--line)}
.tile.info{border-left-color:var(--blue)}.tile.cs{border-left-color:var(--purple)}.tile.lg{border-left-color:var(--amber)}.tile.warn{border-left-color:var(--red)}
.th{display:flex;align-items:center;gap:6px;font-size:11.5px}.th .ic{font-size:14px}.th .nm{font-weight:600;color:#4a4335}
.val{font-size:26px;font-weight:800;color:#1c1c1c;margin:5px 0 2px}
.desc{font-size:11px;color:var(--mut)}
.note{background:#eef3f6;border:1px solid #cfe0e8;border-left:4px solid var(--blue);border-radius:10px;padding:10px 14px;margin:14px 0;font-size:12.5px;color:#33566a;line-height:1.5}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
h2{font-size:15px;margin:0 0 10px}
.lfilt{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.lfilt button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;font-weight:600;color:var(--ink)}
.lfilt button.on{background:#4a4335;color:#fff;border-color:#4a4335}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right;white-space:nowrap}
a.ord{color:var(--blue);font-weight:700;text-decoration:none}a.ord:hover{text-decoration:underline}
.chip{font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;white-space:nowrap}
.chip.cs{color:#4b3f86;background:#ece8f7}.chip.lg{color:#8a5a1a;background:#f6ecdd}
.chip.warn{color:#a13a22;background:#f6e7e2}
.items{color:var(--mut);font-size:12px}
.grbar{display:flex;flex-direction:column;gap:5px}
.grrow{display:flex;align-items:center;gap:8px;font-size:12.5px}
.grrow .lab{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grrow .b{height:8px;border-radius:5px;background:var(--gold);min-width:3px}
.grrow .amt{width:110px;text-align:right;color:var(--mut);font-weight:700}
.foot{color:var(--mut);font-size:11px;margin-top:16px;line-height:1.5}
</style></head><body><div class=wrap>
<div class=brand>7 O'CLOCK · CONTROLLING</div><h1>Erstattungen</h1>
<div class=sub>Woraus sich die Erstattungen zusammensetzen — je Bestellung, Betrag, Grund und Quelle (Kundenservice via Resolvia vs. Lager/Retoure). Klick öffnet die Bestellung in Shopify.</div>
<div class=bar>
 <span class=flab>Zeitraum</span>
 <button data-day=0 class=on>Heute</button><button data-day=1>Gestern</button><button data-a=7>7 Tage</button><button data-a=30>30 Tage</button>
 <span class=flab style="margin-left:6px">eigener</span><input type=date id=d1><input type=date id=d2><button id=dgo>OK</button>
</div>
<div id=stand>lädt …</div>
<div class=grid id=tiles></div>
<div class=note id=recon></div>
<div class=sec><h2>Gründe</h2><div id=gruende class=grbar></div></div>
<div class=sec>
 <h2 id=listTitle>Einzelne Erstattungen</h2>
 <div class=lfilt id=qfilt></div>
 <div id=table></div>
</div>
<div class=foot id=legend></div>
</div>
<script>
const W="https://rohertrag-worker.can-11b.workers.dev/refunds.json";
let CUR=null,QF="alle";
const $=id=>document.getElementById(id);
const eur=n=>(n<0?"−€":"€")+Math.abs(Math.round((n||0)*100)/100).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});
const nf=n=>Math.round(n||0).toLocaleString("de-DE");
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmtd=s=>{const p=String(s).slice(0,10).split("-");return p[2]+"."+p[1]+"."+p[0];};
const hhmm=s=>{const d=new Date(s);return pad(d.getHours())+":"+pad(d.getMinutes());};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function tile(cls,ic,nm,val,desc){return '<div class="tile '+cls+'"><div class=th><span class=ic>'+ic+'</span><span class=nm>'+nm+'</span></div><div class=val>'+val+'</div><div class=desc>'+(desc||"")+'</div></div>';}
function itemsTxt(r){if(!r.items||!r.items.length)return '<span class=items>nur Geld (kein Artikel zurück)</span>';return '<span class=items>'+r.items.map(it=>esc(nf(it.qty)+'× '+it.title)).join(', ')+'</span>';}
function render(){
 if(!CUR)return;
 let t="";
 t+=tile("info","↩️","Erstattungen (brutto)",eur(CUR.total),nf(CUR.count)+" Buchungen");
 t+=tile("cs","🎧","Kundenservice",eur(CUR.kundenservice),nf(CUR.ksCount)+" · via Resolvia");
 t+=tile("lg","🏭","Lager / Retoure",eur(CUR.lager),nf(CUR.lagerCount)+" · physische Rücksendung");
 t+=tile(CUR.auffaellig>0?"warn":"info","🚩","Auffällig",nf(CUR.auffaellig),"Doppel / über Bestellwert");
 $("tiles").innerHTML=t;
 $("recon").innerHTML="ℹ️ Die Summe hier ist <b>brutto</b> (inkl. MwSt) — das ist der echte Betrag, der an Kund:innen zurückging. Die Kachel „Erstattungen“ in der Summary zeigt den <b>Netto</b>-Anteil (ohne MwSt), daher ist sie etwas niedriger. Beide beziehen sich auf denselben Vorgang.";
 // Gründe
 const gmax=Math.max(1,...(CUR.gruende||[]).map(g=>g.amount));
 $("gruende").innerHTML=(CUR.gruende||[]).map(g=>'<div class=grrow><span class=lab>'+esc(g.grund)+'</span><span class=b style="width:'+Math.max(3,g.amount/gmax*100)+'%"></span><span class=amt>'+eur(g.amount)+' · '+g.count+'×</span></div>').join("")||'<span class=items>keine Daten</span>';
 renderTable();
 const gen=CUR.generatedAt?new Date(CUR.generatedAt):null;
 $("stand").innerHTML="<b>"+fmtd(CUR.since)+(CUR.until!==CUR.since?" – "+fmtd(CUR.until):"")+"</b> · "+nf(CUR.count)+" Erstattungen"+(gen?" · Stand "+pad(gen.getDate())+"."+pad(gen.getMonth()+1)+". "+pad(gen.getHours())+":"+pad(gen.getMinutes()):"");
}
function renderTable(){
 const all=CUR.refunds||[];
 const nCS=all.filter(r=>r.quelle==="Kundenservice").length,nLG=all.length-nCS;
 const bt=(f,lab)=>'<button class="'+(QF===f?"on":"")+'" onclick="setQF(\''+f+'\')">'+lab+'</button>';
 $("qfilt").innerHTML=bt("alle","Alle ("+all.length+")")+bt("Kundenservice","🎧 Kundenservice ("+nCS+")")+bt("Lager","🏭 Lager ("+nLG+")");
 const L=QF==="alle"?all:all.filter(r=>r.quelle===QF);
 const link=id=>"https://admin.shopify.com/store/7oclock-de/orders/"+id;
 let h='<table><tr><th>Bestellung</th><th>Zeit</th><th>Quelle</th><th class=n>Betrag</th><th>Grund</th><th>Artikel</th></tr>';
 h+=L.map(r=>{
  const q=r.quelle==="Kundenservice"?'<span class="chip cs">Kundenservice</span>':'<span class="chip lg">Lager</span>';
  const flags=(r.doppelt?' <span class="chip warn">Doppel</span>':'')+(r.ueberBestellwert?' <span class="chip warn">&gt; Bestellwert</span>':'');
  return '<tr><td><a class=ord href="'+link(r.id)+'" target=_blank rel=noopener>'+esc(r.order)+'</a>'+flags+'</td><td>'+hhmm(r.createdAt)+'</td><td>'+q+'</td><td class=n style="font-weight:700">'+eur(r.amount)+'</td><td>'+(esc(r.note)||'<span class=items>—</span>')+'</td><td>'+itemsTxt(r)+'</td></tr>';
 }).join("");
 h+='</table>'+(L.length?'':'<div class=items style="padding:6px 0">Keine Erstattungen in dieser Auswahl.</div>');
 $("table").innerHTML=h;
 $("listTitle").textContent="Einzelne Erstattungen ("+L.length+")";
}
function setQF(f){QF=f;renderTable();}
function load(a,b,label){$("stand").textContent="lädt "+(label||"")+" …";fetch(W+"?since="+a+"&until="+b+"&z="+Date.now()).then(r=>r.json()).then(d=>{CUR=d;render();}).catch(e=>{$("stand").textContent="Fehler: "+e;});}
function clearZ(){document.querySelectorAll(".bar button[data-a],.bar button[data-day]").forEach(y=>y.classList.remove("on"));}
document.querySelectorAll(".bar button[data-day]").forEach(x=>x.onclick=()=>{clearZ();x.classList.add("on");const d=new Date();d.setDate(d.getDate()-(+x.dataset.day));const t=iso(d);load(t,t,x.textContent);});
document.querySelectorAll(".bar button[data-a]").forEach(x=>x.onclick=()=>{clearZ();x.classList.add("on");const e=new Date();const s=new Date();s.setDate(s.getDate()-(+x.dataset.a-1));load(iso(s),iso(e),x.textContent);});
$("dgo").onclick=()=>{const a=$("d1").value,b=$("d2").value;if(!a||!b)return;if(a>b){alert("Von nach Bis");return;}clearZ();load(a,b,"eigener");};
$("legend").innerHTML="Quelle: Shopify Admin (Refunds). <b>Kundenservice</b> = über Resolvia bearbeitet (Notiz „Refund processed via Resolvia“); <b>Lager</b> = alle übrigen (physische Rücksendungen, manuell in Shopify). Den exakten Bearbeiter-Namen gibt Shopify nur mit Sonder-Freischaltung (read_users) her. <b>Auffällig</b>: „Doppel“ = mehrere Erstattungen auf dieselbe Bestellung im Zeitraum · „&gt; Bestellwert“ = Erstattung höher als der Bestellwert. Beträge brutto (inkl. MwSt).";
(function(){const t=iso(new Date());load(t,t,"Heute");})();
</script></body></html>
